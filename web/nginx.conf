# Preserve the original scheme when Cloudflare/cloudflared already forwards it.
map $http_x_forwarded_proto $slicequote_forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
  text/plain
  text/css
  application/json
  application/javascript
  application/xml
  image/svg+xml;

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  client_max_body_size 12m;
  client_body_timeout 60s;

  # Docker's embedded DNS. Using a variable in proxy_pass keeps nginx from
  # failing at startup when the app container is temporarily unavailable.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://app:8080;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;

  # Spring Boot API. The rewrite strips /api/ before proxying.
  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $slicequote_forwarded_proto;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection "";

    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
  }

  # Vite fingerprints these filenames.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # The sample model is static and fairly large.
  location /models/ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Client-side routes (/login, /quote) must fall back to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }
}
