# Pull-and-run stack: docker compose up -d  →  http://localhost:3000
# Build from source: docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# Every value below has a working default, so no .env is required for local use.
# Production overrides (JWT_SECRET, DB_PASSWORD, CLOUDFLARED_TOKEN, ...) live in .env,
# which Compose loads automatically for ${...} interpolation.

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-slicequote}
      POSTGRES_USER: ${DB_USER:-slicequote}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-slicequote}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-slicequote} -d ${DB_NAME:-slicequote}"]
      interval: 5s
      timeout: 5s
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    image: ghcr.io/abdulkaderbaghaffar/slicequote:latest
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-slicequote}
      DB_USER: ${DB_USER:-slicequote}
      DB_PASSWORD: ${DB_PASSWORD:-slicequote}
      # Dev-only default. Set a real secret in .env before exposing this publicly.
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me-32b}
      STORAGE_ROOT: /app/uploads
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
    # Loopback-only: use the web container/tunnel for public traffic.
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    volumes:
      - uploads:/app/uploads

  web:
    image: ghcr.io/abdulkaderbaghaffar/slicequote:web
    depends_on:
      app:
        condition: service_healthy
    # Loopback-only for local production testing. The tunnel reaches web:80
    # directly over the Compose network.
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Opt-in: docker compose --profile tunnel up -d
  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TOKEN:-}
    depends_on:
      web:
        condition: service_healthy
    restart: always

volumes:
  pgdata:
  uploads:
