services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    image: ghcr.io/abdulkaderbaghaffar/slicequote:latest
    build: .
    user: "1000:1000"
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
    # Loopback-only: use the web container/tunnel for public traffic.
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data/uploads:/app/uploads

  web:
    image: ghcr.io/abdulkaderbaghaffar/slicequote-web:latest
    build:
      context: ./web
      args:
        VITE_API_URL: /api
    depends_on:
      app:
        condition: service_healthy
    # Loopback-only for local production testing. The tunnel reaches web:80
    # directly over the Compose network.
    ports:
      - "127.0.0.1:3000:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  slicequote-cloudlfared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TOKEN}
    depends_on:
      web:
        condition: service_healthy
    restart: always

volumes:
  pgdata:
